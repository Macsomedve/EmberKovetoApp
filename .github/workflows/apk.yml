name: Sajat APK Kesztites
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: App felepitese
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          npx cap init "Emberkoveto Kamera" "com.sajat.emberkoveto" --web-dir=www
          npx cap add android
          python3 -c 'p="android/app/src/main/AndroidManifest.xml"; s=open(p).read().replace("<application", "<uses-permission android:name=\"android.permission.CAMERA\" />\n    <application"); open(p,"w").write(s)'
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EmberkovetoKamera-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
