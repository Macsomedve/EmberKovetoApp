name: Sajat APK Kesztites
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: App felepitese
        run: |
          mkdir -p www
          cp index.html www/
          curl -L https://jsdelivr.net -o www/tf.min.js
          curl -L https://jsdelivr.net -o www/coco-ssd.min.js
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          npx cap init "Emberkoveto Kamera" "com.sajat.emberkoveto" --web-dir=www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EmberkovetoKamera-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
