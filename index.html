<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Emberkövető Kamera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    html, body { width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; }
    #loader {
      position: fixed; inset: 0; background: #09090b; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px;
    }
    .spinner {
      width: 52px; height: 52px; border: 4px solid #27272a; border-top-color: #22c55e;
      border-radius: 50%; animation: spin 0.9s linear infinite; margin-bottom: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #cam-container { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; }
    video { display: none; }
    canvas { width: 100%; height: 100%; object-fit: cover; }
    .top-bar {
      position: fixed; top: 14px; left: 14px; right: 14px; z-index: 20;
      display: flex; justify-content: space-between; align-items: center; pointer-events: none;
    }
    .badge {
      background: rgba(0, 0, 0, 0.65); padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600;
      border: 1px solid rgba(255,255,255,0.15); display: flex; align-items: center; gap: 8px;
    }
    .rec-dot { width: 9px; height: 9px; background: #22c55e; border-radius: 50%; }
    .bottom-bar {
      position: fixed; bottom: 20px; left: 16px; right: 16px; z-index: 20;
      background: rgba(18, 18, 22, 0.85); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px;
      padding: 12px 16px; display: flex; justify-content: space-around; align-items: center;
    }
    .ctrl-btn {
      background: transparent; border: none; color: #d4d4d8; display: flex; flex-direction: column;
      align-items: center; gap: 4px; font-size: 11px; font-weight: 600; cursor: pointer; padding: 6px 10px;
    }
    .ctrl-btn .icon {
      width: 42px; height: 42px; border-radius: 50%; background: #27272a;
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .ctrl-btn.active .icon { background: #22c55e; color: #000; }
    .ctrl-btn.active { color: #22c55e; }
    #gallery-modal {
      position: fixed; inset: 0; background: #09090b; z-index: 60; display: none; flex-direction: column;
    }
    .gal-head {
      padding: 18px 20px; background: #18181b; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #27272a;
    }
    .gal-grid {
      flex: 1; overflow-y: auto; padding: 16px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; align-content: start;
    }
    .photo-card { background: #18181b; border-radius: 12px; overflow: hidden; border: 1px solid #27272a; }
    .photo-card img { width: 100%; display: block; }
    .photo-card a {
      display: block; text-align: center; padding: 10px; font-size: 13px;
      background: #22c55e; color: #000; text-decoration: none; font-weight: 700;
    }
    .close-btn { background: #ef4444; color: #fff; border: none; padding: 8px 14px; border-radius: 10px; font-weight: 600; }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <h2 style="color:#22c55e; margin-bottom:8px;">EMBERKÖVETŐ AI</h2>
    <p id="load-text" style="color:#a1a1aa; font-size:14px;">Rendszer indítása...</p>
  </div>
  <div id="cam-container">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>
  <div class="top-bar">
    <div class="badge"><div class="rec-dot"></div><span id="live-clock">00:00:00</span></div>
    <div class="badge" id="status-badge">KÉSZENLÉT</div>
  </div>
  <div class="bottom-bar">
    <button class="ctrl-btn" id="nv-btn"><div class="icon">👁️</div><span>NIGHT VISION</span></button>
    <button class="ctrl-btn active" id="auto-btn"><div class="icon">📸</div><span>AUTO FOTÓ</span></button>
    <button class="ctrl-btn" id="cam-btn"><div class="icon">🔄</div><span>KAMERA</span></button>
    <button class="ctrl-btn" id="gal-btn"><div class="icon">🖼️</div><span>KÉPEK (<span id="count">0</span>)</span></button>
  </div>
  <div id="gallery-modal">
    <div class="gal-head">
      <h3>Rögzített felvételek</h3>
      <div style="display:flex; gap:8px;">
        <button id="clear-btn" class="close-btn" style="background:#3f3f46;">Törlés</button>
        <button id="close-gal" class="close-btn">Bezárás</button>
      </div>
    </div>
    <div class="gal-grid" id="gallery"></div>
  </div>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const loader = document.getElementById('loader');
    const loadText = document.getElementById('load-text');
    const statusBadge = document.getElementById('status-badge');
    let model = null, nightVision = false, autoPhoto = true, facingMode = 'environment', lastSavedPos = null, lastSavedTime = 0, savedCount = 0;

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src; s.onload = resolve; s.onerror = reject;
        document.head.appendChild(s);
      });
    }
    document.getElementById('nv-btn').onclick = (e) => { nightVision = !nightVision; e.currentTarget.classList.toggle('active', nightVision); };
    document.getElementById('auto-btn').onclick = (e) => { autoPhoto = !autoPhoto; e.currentTarget.classList.toggle('active', autoPhoto); };
    document.getElementById('cam-btn').onclick = async () => { facingMode = facingMode === 'environment' ? 'user' : 'environment'; await startCamera(); };
    document.getElementById('gal-btn').onclick = () => { document.getElementById('gallery-modal').style.display = 'flex'; };
    document.getElementById('close-gal').onclick = () => { document.getElementById('gallery-modal').style.display = 'none'; };
    document.getElementById('clear-btn').onclick = () => { document.getElementById('gallery').innerHTML = ''; savedCount = 0; document.getElementById('count').textContent = '0'; };

    async function startCamera() {
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      video.srcObject = stream;
      await video.play();
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    function applyNightVision(ctx, w, h) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        let lum = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) * 1.45 + 15;
        if (lum > 255) lum = 255;
        d[i] = lum * 0.12; d[i + 1] = lum; d[i + 2] = lum * 0.15;
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function getFormattedTime() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }

    function saveSnapshot(timeStr) {
      const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
      const fileName = `ember_${timeStr.replace(/[: ]+/g, '_')}.jpg`;
      savedCount++;
      document.getElementById('count').textContent = savedCount;
      const card = document.createElement('div');
      card.className = 'photo-card';
      card.innerHTML = `<img src="${dataUrl}" /><a href="${dataUrl}" download="${fileName}">Mentés (${timeStr.split(' ')[1]})</a>`;
      document.getElementById('gallery').prepend(card);
      statusBadge.textContent = 'FOTÓ RÖGZÍTVE!';
      statusBadge.style.color = '#22c55e';
      setTimeout(() => { statusBadge.textContent = 'KÉSZENLÉT'; statusBadge.style.color = '#fff'; }, 1500);
    }

    async function detectLoop() {
      if (video.readyState === 4) {
        const w = canvas.width, h = canvas.height;
        ctx.save();
        if (facingMode === 'user') { ctx.translate(w, 0); ctx.scale(-1, 1); }
        ctx.drawImage(video, 0, 0, w, h);
        ctx.restore();
        if (nightVision) applyNightVision(ctx, w, h);

        const predictions = await model.detect(canvas);
        const people = predictions.filter(p => p.class === 'person' && p.score > 0.60);
        const nowMs = Date.now();
        let shouldSave = false;

        people.forEach((p) => {
          const [x, y, bw, bh] = p.bbox;
          ctx.strokeStyle = nightVision ? '#86efac' : '#22c55e';
          ctx.lineWidth = 3;
          ctx.strokeRect(x, y, bw, bh);
          ctx.fillStyle = nightVision ? '#86efac' : '#22c55e';
          ctx.font = 'bold 18px sans-serif';
          ctx.fillText(`EMBER ${Math.round(p.score * 100)}%`, x, Math.max(24, y - 8));

          const cx = x + bw / 2, cy = y + bh / 2;
          let moved = true;
          if (lastSavedPos && Math.hypot(cx - lastSavedPos.x, cy - lastSavedPos.y) < 30) moved = false;
          if (autoPhoto && moved && (nowMs - lastSavedTime >= 3000)) {
            shouldSave = true;
            lastSavedPos = { x: cx, y: cy };
            lastSavedTime = nowMs;
          }
        });

        const timeStr = getFormattedTime();
        document.getElementById('live-clock').textContent = timeStr.split(' ')[1];
        ctx.font = 'bold 18px monospace';
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillText(timeStr, 16, h - 16);
        ctx.fillStyle = '#fff';
